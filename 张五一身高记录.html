<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 张五一身高记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fff8f0 0%, #ffe8d6 100%);
    color: #5a4a3a; padding: 20px; min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, #ff9a56, #ff7b54);
    color: #fff; border-radius: 20px; padding: 24px 28px;
    box-shadow: 0 8px 24px rgba(255,123,84,.3); margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  header::before {
    content: "🌻"; position: absolute; right: 20px; top: 10px;
    font-size: 60px; opacity: .3; transform: rotate(15deg);
  }
  header::after {
    content: "🦒"; position: absolute; right: 80px; bottom: -10px;
    font-size: 50px; opacity: .25;
  }
  header h1 { font-size: 24px; font-weight: 700; }
  header h1::before { content: "📏 "; }
  header p { opacity: .95; margin-top: 8px; font-size: 14px; }
  .card {
    background: #fff; border-radius: 18px; padding: 22px;
    box-shadow: 0 4px 16px rgba(255,154,86,.1);
    margin-bottom: 20px; border: 2px solid #fff0e8;
  }
  .form-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 13px; color: #a08060; margin-bottom: 6px; font-weight: 500; }
  .field label::before { content: "🌟 "; font-size: 11px; }
  input, button { font-family: inherit; font-size: 15px; }
  input[type=date], input[type=number], textarea {
    padding: 11px 14px; border: 2px solid #ffe8d6; border-radius: 12px;
    background: #fffbf8; outline: none; transition: all .2s;
    color: #5a4a3a;
  }
  input:focus, textarea:focus { border-color: #ff9a56; background: #fff; }
  input[type=number] { width: 140px; }
  textarea { width: 180px; resize: none; height: 42px; }
  .btn {
    background: linear-gradient(135deg, #ff9a56, #ff7b54);
    color: #fff; border: none; border-radius: 12px;
    padding: 12px 26px; cursor: pointer; font-weight: 600;
    transition: all .2s; box-shadow: 0 4px 12px rgba(255,123,84,.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255,123,84,.4); }
  .btn::before { content: "✨ "; }
  .btn.ghost {
    background: #fff5f0; color: #ff7b54; border: 2px solid #ffd4c4;
    box-shadow: none;
  }
  .btn.ghost:hover { background: #ffe8d6; }
  .btn.ghost::before { content: "📦 "; }
  #clearBtn::before { content: "🗑️ "; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 130px; background: linear-gradient(135deg, #fff8f0, #ffe8d6);
    border-radius: 14px; padding: 18px; text-align: center;
    border: 2px solid #ffd4c4; position: relative;
  }
  .stat::before {
    content: "🎈"; position: absolute; top: -8px; right: 10px;
    font-size: 20px;
  }
  .stat:nth-child(2)::before { content: "📊"; }
  .stat:nth-child(3)::before { content: "🚀"; }
  .stat .num { font-size: 28px; font-weight: 700; color: #ff7b54; }
  .stat .lab { font-size: 13px; color: #a08060; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { padding: 12px 10px; text-align: left; font-size: 15px; border-bottom: 2px solid #fff0e8; }
  th { color: #c4a080; font-weight: 600; font-size: 13px; }
  th::before { content: "🌸 "; font-size: 11px; }
  tbody tr:hover { background: #fffbf8; }
  tbody tr:nth-child(even) { background: #fffbf8; }
  .del { color: #ff6b6b; cursor: pointer; font-size: 14px; border: none; background: none; }
  .del::before { content: "🗑️ "; }
  .del:hover { color: #ff4757; }
  .age-tag {
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    color: #d35400; font-weight: 600; padding: 4px 12px;
    border-radius: 20px; display: inline-block; font-size: 13px;
  }
  canvas { width: 100%; height: 340px; display: block; }
  .empty { text-align: center; color: #c4b0a0; padding: 40px; font-size: 15px; }
  .empty::before { content: "🌱 "; font-size: 30px; display: block; margin-bottom: 10px; }
  .toolbar { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  h2 { font-size: 18px; margin-bottom: 16px; color: #6b5344; }
  h2::before { content: "🌈 "; }
  .growth-up { color: #27ae60; }
  .growth-up::before { content: "📈 "; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>张五一身高记录</h1>
    <p>🎂 生日：2018-05-25 ｜ 🎉 年龄自动计算 ｜ 💾 数据保存在本机浏览器</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="field">
        <label>测量日期</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label>身高（cm）</label>
        <input type="number" id="height" step="0.1" min="40" max="250" placeholder="如 152.5">
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <input type="text" id="note" placeholder="如 体检 / 早上">
      </div>
      <button class="btn" id="addBtn">添加记录</button>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="expBtn">导出数据</button>
      <button class="btn ghost" id="impBtn">导入数据</button>
      <input type="file" id="impFile" accept="application/json" style="display:none">
      <button class="btn ghost" id="clearBtn">清空全部</button>
    </div>
  </div>

  <div class="card">
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>身高成长曲线</h2>
    <canvas id="chart"></canvas>
    <div class="empty" id="chartEmpty">还没有记录呢，添加第一条就开始画曲线啦～</div>
  </div>

  <div class="card">
    <h2>记录明细</h2>
    <table>
      <thead>
        <tr><th>日期</th><th>年龄</th><th>身高(cm)</th><th>备注</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="tableEmpty">暂无数据</div>
  </div>
</div>

<script>
const BIRTHDAY = new Date(2018, 4, 25); // 2018-05-25
const KEY = 'zwx_heights_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { return []; }
}
function save(arr) { localStorage.setItem(KEY, JSON.stringify(arr)); }

let records = load();

function calcAge(dateStr) {
  const d = new Date(dateStr);
  let years = d.getFullYear() - BIRTHDAY.getFullYear();
  let months = d.getMonth() - BIRTHDAY.getMonth();
  if (d.getDate() < BIRTHDAY.getDate()) months--;
  if (months < 0) { years--; months += 12; }
  return { years, months, text: `${years}岁${months}个月` };
}

function fmtDate(s) {
  const d = new Date(s);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function sortRecs() {
  records.sort((a,b) => new Date(a.date) - new Date(b.date));
}

function render() {
  sortRecs();
  const tbody = document.getElementById('tbody');
  const tableEmpty = document.getElementById('tableEmpty');
  tbody.innerHTML = '';
  records.forEach((r, i) => {
    const age = calcAge(r.date);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fmtDate(r.date)}</td><td><span class="age-tag">${age.text}</span></td>` +
                   `<td><strong>${Number(r.height).toFixed(1)}</strong></td><td>${r.note||'-'}</td>` +
                   `<td><button class="del" data-i="${i}">删除</button></td>`;
    tbody.appendChild(tr);
  });
  tableEmpty.style.display = records.length ? 'none' : 'block';

  const stats = document.getElementById('stats');
  if (records.length) {
    const latest = records[records.length-1];
    const first = records[0];
    const growth = (latest.height - first.height).toFixed(1);
    const growthText = records.length > 1 ? `+${growth}` : '—';
    stats.innerHTML =
      `<div class="stat"><div class="num">${Number(latest.height).toFixed(1)}</div><div class="lab">最新身高 cm</div></div>` +
      `<div class="stat"><div class="num">${records.length}</div><div class="lab">记录次数</div></div>` +
      `<div class="stat"><div class="num ${growth > 0 ? 'growth-up' : ''}">${growthText}</div><div class="lab">累计增长 cm</div></div>`;
  } else {
    stats.innerHTML = '<div class="empty">添加记录后显示统计</div>';
  }

  drawChart();
}

function drawChart() {
  const canvas = document.getElementById('chart');
  const empty = document.getElementById('chartEmpty');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = 340;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  if (records.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const padL = 52, padR = 24, padT = 24, padB = 48;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const hs = records.map(r => r.height);
  let minH = Math.min(...hs), maxH = Math.max(...hs);
  const range = (maxH - minH) || 10;
  minH = Math.floor(minH - range*0.15); maxH = Math.ceil(maxH + range*0.15);
  const n = records.length;
  const xAt = i => n === 1 ? padL + plotW/2 : padL + plotW * i/(n-1);
  const yAt = h => padT + plotH * (1 - (h - minH)/(maxH - minH));

  // grid + y labels
  ctx.strokeStyle = '#ffe8d6'; ctx.lineWidth = 1;
  ctx.fillStyle = '#c4a080'; ctx.font = '12px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const ticks = 5;
  for (let t=0; t<=ticks; t++) {
    const val = minH + (maxH-minH)*t/ticks;
    const y = yAt(val);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillText(val.toFixed(0), padL-8, y);
  }

  // area fill
  const grad = ctx.createLinearGradient(0, padT, 0, H-padB);
  grad.addColorStop(0, 'rgba(255,154,86,0.3)');
  grad.addColorStop(1, 'rgba(255,154,86,0.05)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  records.forEach((r,i) => {
    const x = xAt(i), y = yAt(r.height);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(xAt(n-1), H-padB);
  ctx.lineTo(xAt(0), H-padB);
  ctx.closePath(); ctx.fill();

  // line
  ctx.strokeStyle = '#ff7b54'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  records.forEach((r,i) => {
    const x = xAt(i), y = yAt(r.height);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();

  // points + labels
  ctx.textAlign = 'center';
  records.forEach((r,i) => {
    const x = xAt(i), y = yAt(r.height);
    // glow
    ctx.fillStyle = 'rgba(255,123,84,0.3)';
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
    // point
    ctx.fillStyle = '#ff7b54';
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    // height label
    ctx.fillStyle = '#5a4a3a'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(Number(r.height).toFixed(1), x, y-12);
    // date label
    ctx.fillStyle = '#a08060'; ctx.font = '11px sans-serif';
    const d = new Date(r.date);
    const lbl = `${d.getMonth()+1}/${d.getDate()}`;
    ctx.fillText(lbl, x, padT + plotH + 20);
  });
}

// events
document.getElementById('addBtn').addEventListener('click', () => {
  const date = document.getElementById('date').value;
  const h = parseFloat(document.getElementById('height').value);
  const note = document.getElementById('note').value.trim();
  if (!date || isNaN(h)) { alert('请填写日期和身高哦 🌻'); return; }
  records.push({ date, height: h, note });
  save(records);
  document.getElementById('height').value = '';
  document.getElementById('note').value = '';
  render();
});

document.getElementById('tbody').addEventListener('click', e => {
  if (e.target.classList.contains('del')) {
    const i = +e.target.dataset.i;
    if (confirm('确定删除这条记录吗？🗑️')) {
      records.splice(i, 1); save(records); render();
    }
  }
});

document.getElementById('expBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '张五一身高记录.json';
  a.click();
});

document.getElementById('impBtn').addEventListener('click', () => document.getElementById('impFile').click());
document.getElementById('impFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { records = JSON.parse(rd.result); save(records); render(); alert('导入成功啦 🎉'); }
    catch(err) { alert('导入失败：文件格式不对 😅'); }
  };
  rd.readAsText(f);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('确定清空全部记录？此操作不可恢复哦 🗑️')) {
    records = []; save(records); render();
  }
});

// init
document.getElementById('date').value = fmtDate(new Date().toISOString());
render();
</script>
</body>
</html>
